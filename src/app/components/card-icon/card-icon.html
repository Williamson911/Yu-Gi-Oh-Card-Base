@switch (icon()) {
  @case ('infinity') {
    <svg class="card-icon" [attr.width]="size()" [attr.height]="size()"
         viewBox="0 0 32 32" role="img" [attr.aria-label]="label() || 'Continu'">
      <path d="M9 8c4 0 5.5 3 7 8s2.5 8 7 8a5 5 0 0 0 0-10c-4 0-5.5 3-7 8s-2.5 8-7 8a5 5 0 0 1 0-10c4 0 5.5 3 7 8"
            fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  }
  @case ('fire') {
    <svg class="card-icon" [attr.width]="size()" [attr.height]="size()"
         viewBox="0 0 32 32" role="img" [attr.aria-label]="label() || 'Rituelle'">
      <path d="M16 3c1 5 6 7 6 13a6 6 0 0 1-12 0c0-2 1-4 2-5 0 3 2 4 3 4-1-3 0-7 1-12z"
            fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  }
  @case ('compass') {
    <svg class="card-icon" [attr.width]="size()" [attr.height]="size()"
         viewBox="0 0 32 32" role="img" [attr.aria-label]="label() || 'Terrain'">
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2"/>
      <polygon points="16,4 19,16 16,28 13,16" fill="currentColor"/>
      <polygon points="4,16 16,13 28,16 16,19" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
    </svg>
  }
  @case ('cross') {
    <svg class="card-icon" [attr.width]="size()" [attr.height]="size()"
         viewBox="0 0 32 32" role="img" [attr.aria-label]="label() || 'Equipement'">
      <path d="M13 4h6v9h9v6h-9v9h-6v-9H4v-6h9z" fill="currentColor"/>
    </svg>
  }
  @case ('lightning') {
    <svg class="card-icon" [attr.width]="size()" [attr.height]="size()"
         viewBox="0 0 32 32" role="img" [attr.aria-label]="label() || 'Jeu-Rapide'">
      <path d="M19 3 6 18h7l-3 11 13-15h-7z" fill="currentColor"
            stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
    </svg>
  }
  @case ('arrow') {
    <svg class="card-icon" [attr.width]="size()" [attr.height]="size()"
         viewBox="0 0 32 32" role="img" [attr.aria-label]="label() || 'Contre-piège'">
      <path d="M4 16h18m0 0-7-7m7 7-7 7"
            fill="none" stroke="currentColor" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  }
  @default { <!-- aucune icône (Normale) --> }
}
