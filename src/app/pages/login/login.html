<app-header />

<main class="auth">
  <form class="auth__card" [formGroup]="loginForm" (ngSubmit)="submit()" autocomplete="on">
    <h1 class="auth__title">Connexion</h1>
    <p class="auth__subtitle">Bon retour, duelliste.</p>

    <label class="auth__field">
      <span>Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        required />
      @if (loginForm.get('email'); as ctrl) {
        @if (ctrl.touched && ctrl.errors?.['required']) {
          <small class="auth__field-error">Email requis.</small>
        } @else if (ctrl.touched && ctrl.errors?.['email']) {
          <small class="auth__field-error">Email invalide.</small>
        }
      }
    </label>

    <label class="auth__field">
      <span>Mot de passe</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required />
      @if (loginForm.get('password'); as ctrl) {
        @if (ctrl.touched && ctrl.errors?.['required']) {
          <small class="auth__field-error">Mot de passe requis.</small>
        }
      }
    </label>

    @if (error()) {
      <p class="auth__error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="auth__submit" [disabled]="busy()">
      @if (busy()) { Connexion… } @else { Se connecter }
    </button>

    <p class="auth__switch">
      Pas encore inscrit ? <a routerLink="/register">Créer un compte</a>
    </p>
  </form>
</main>
